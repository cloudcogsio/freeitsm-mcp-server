name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly: a pinned image can become vulnerable without any change here.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  # The publish workflow runs these checks before it publishes an image.
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every supported Node line; the image runs the newest.
        node: [22, 24, 26]
    name: test (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - if: matrix.node == 26
        run: npm audit --omit=dev --audit-level=high

  # The required check: passes only when every Node version passed. It always runs,
  # because a skipped required check would count as passing.
  test:
    needs: unit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.unit.result }}" = success

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t freeitsm-mcp-server:ci .
      - name: Scan the image (fixable high and critical vulnerabilities fail the build)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: freeitsm-mcp-server:ci
          only-fixed: true
          severity-cutoff: high
          fail-build: true
          output-format: table
